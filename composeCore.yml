services:
  backend:
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env.development
    volumes:
      - ./server/certs:/server/certs
      - ./server/src:/server/src
      - ./server/test:/server/test
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy


  redis:
    image: "redis:8.6.0-alpine"
    expose:
      - "6379"
    command: ["redis-server"]
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 1s
      timeout: 20s

  migrate:
    image: "amacneil/dbmate"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env.development
    volumes:
      - ./server/db/migrations:/db/migrations
    command: ["up"]

  db:
    image: "mysql:latest"
    expose:
      - "3306"
    env_file:
      - ./server/.env.development
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      interval: 10s
      retries: 5



