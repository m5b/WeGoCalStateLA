name: wego-prototype

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.prototype
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --performance-schema=OFF
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - prototype-db-data:/var/lib/mysql

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prototype
    environment:
      DB_HOST: db
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}
      UPLOAD_DIR: /server/uploads
      SERVER_PUBLIC_URL: http://146.190.55.14:3000
      SERVER_URL: http://146.190.55.14:3000/api
      KEYCLOAK_ISSUER: https://placeholder.invalid/realms/wegoapp
      KEYCLOAK_AUDIENCE: placeholder
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      GOOGLE_CALLBACK_URL: /auth/google/callback
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    volumes:
      - prototype-uploads-data:/server/uploads

  migrate:
    image: amacneil/dbmate:latest
    profiles: ["tools"]
    env_file:
      - .env.prototype
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/db/migrations:/db/migrations:ro,Z
    command: ["up"]

volumes:
  prototype-db-data:
  prototype-uploads-data:

