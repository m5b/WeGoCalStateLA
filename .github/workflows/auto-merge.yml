name: Queue trusted pull request

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Merge verified application work and start deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          sensitive_files=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' |
            grep -E '^(\.github/|deploy/|infra/)' || true)

          if [ -n "$sensitive_files" ]; then
            echo "Owner approval is required for protected files:"
            printf '%s\n' "$sensitive_files"
            gh pr merge --auto --squash "$PR_URL"
            exit 0
          fi

          gh pr checks "$PR_URL" --required --watch --fail-fast
          gh pr merge --squash "$PR_URL"
          gh workflow run deploy.yml --ref main
