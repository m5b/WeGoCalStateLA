<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thread App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Thread Page</h1>
    <button class="toggle-btn" onclick="toggleIdType()">Show ID Anonymus</button>
    <form id="threadForm" action="http://localhost:3001/api/threads" method="POST">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required>
      <label for="thread">Thread:</label>
      <textarea id="thread" name="thread" required></textarea>
      <div class="id-choice">
        <label><input type="radio" name="idType" value="id" checked> Use ID</label>
        <label><input type="radio" name="idType" value="id_anonymus"> Use ID Anonymus</label>
      </div>
      <button type="submit">Post Thread</button>
    </form>
    <div id="threadList">
      <!-- Threads will be populated here via JavaScript -->
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
